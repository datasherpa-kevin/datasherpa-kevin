<script>
/* GA4 상담 클릭 측정: 전화·DM·상담 버튼을 누른 횟수를 위치별로 기록 */
(function(){
  function send(method,a){
    if(typeof gtag!=='function') return;
    var where=a.closest('header')?'header':(a.closest('#contact')?'contact':'hero');
    gtag('event','generate_lead',{method:method,button_location:where,transport_type:'beacon'});
    gtag('event','contact_click',{method:method,button_location:where,transport_type:'beacon'});
  }
  document.querySelectorAll('a[href^="tel:"]').forEach(function(a){a.addEventListener('click',function(){send('phone',a);});});
  document.querySelectorAll('a[href^="https://ig.me/m/"]').forEach(function(a){a.addEventListener('click',function(){send('instagram_dm',a);});});
  document.querySelectorAll('a[href="#contact"]').forEach(function(a){a.addEventListener('click',function(){
    if(typeof gtag==='function') gtag('event','cta_click',{button_location:a.closest('header')?'header':'hero'});
  });});
})();
</script>
<script>
/* 상담 버튼: 카카오톡·네이버 등 앱 안 브라우저에서도 전화/인스타그램 앱이 열리도록 처리 */
(function(){
  var ua=navigator.userAgent||'';
  var isAndroid=/Android/i.test(ua);
  var IG_USER='kevin_datasherpa';
  var IG_DM='https://ig.me/m/'+IG_USER;
  var IG_WEB='https://www.instagram.com/'+IG_USER+'/';
  var TEL='01071126118';
  document.querySelectorAll('a[href^="https://ig.me/m/"]').forEach(function(a){
    a.addEventListener('click',function(e){
      if(isAndroid){
        e.preventDefault();
        // 안드로이드: 인스타그램 앱으로 DM 링크를 강제로 열고, 앱이 없으면 웹 프로필로 이동
        window.location.href='intent://ig.me/m/'+IG_USER+'#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url='+encodeURIComponent(IG_WEB)+';end';
      }
    });
  });
  document.querySelectorAll('a[href^="tel:"]').forEach(function(a){
    a.removeAttribute('target');
    a.addEventListener('click',function(e){
      if(isAndroid){
        e.preventDefault();
        // 안드로이드: 전화 앱(다이얼)을 직접 호출
        window.location.href='intent:'+TEL+'#Intent;scheme=tel;action=android.intent.action.DIAL;end';
        setTimeout(function(){ if(!document.hidden){ window.location.href='tel:'+TEL; } },800);
      }
    });
  });
})();
</script>
